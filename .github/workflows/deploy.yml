name: Deploy
on:
  workflow_dispatch:
    inputs:
      target:
        description: Separate protected environment; begin with feasibility
        required: true
        default: feasibility
        type: choice
        options: [feasibility, production]
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: test -f pnpm-lock.yaml
      - run: npm install --global pnpm@10.13.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --prod --audit-level=high
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    environment: ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global pnpm@10.13.1
      - run: pnpm install --frozen-lockfile
      - name: Render explicit private deployment config
        run: pnpm deploy:config
        env:
          GATEWAY_MODE: ${{ inputs.target }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          OAUTH_KV_NAMESPACE_ID: ${{ secrets.OAUTH_KV_NAMESPACE_ID }}
          RATE_AUTH_NAMESPACE_ID: ${{ vars.RATE_AUTH_NAMESPACE_ID }}
          RATE_READ_NAMESPACE_ID: ${{ vars.RATE_READ_NAMESPACE_ID }}
          RATE_CONTROL_NAMESPACE_ID: ${{ vars.RATE_CONTROL_NAMESPACE_ID }}
          GATEWAY_DISABLED: ${{ vars.GATEWAY_DISABLED }}
          CONFIRMED_FREE_PLAN: ${{ vars.CONFIRMED_FREE_PLAN }}
          BUILD_COMMIT: ${{ github.sha }}
      - name: Deploy validated commit only
        run: |
          pnpm exec wrangler deploy --config .deploy/wrangler.json --message "commit:${GITHUB_SHA}"
          printf 'Deployed commit: %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
