name: Dependency refresh
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global pnpm@10.13.1
      - name: Resolve real dependencies, format and run every gate
        run: pnpm bootstrap --refresh
      - name: Prepare reviewed application patch, not an automatic push
        if: always()
        run: |
          mkdir -p reports/bootstrap
          if test -f pnpm-lock.yaml; then git add -N pnpm-lock.yaml; fi
          git diff --binary > reports/bootstrap/dependencies-and-format.patch
          git rev-parse HEAD > reports/bootstrap/base-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-bootstrap-${{ github.sha }}
          path: |
            reports/bootstrap/
            reports/core-tests.*
            reports/worker-tests.xml
            pnpm-lock.yaml
          retention-days: 7
